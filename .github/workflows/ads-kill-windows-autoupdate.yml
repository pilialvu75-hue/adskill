name: ADS Kill - Windows standalone beta
on:
  push:
    branches:
      - feature/windows-auto-updater-0.2.0
    paths:
      - 'windows/**'
      - '.github/workflows/ads-kill-windows-autoupdate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adskill-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-beta:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test HOSTS safety and beta update ordering offline
        shell: pwsh
        run: dotnet run --project windows/AdsKill.Windows.Tests/AdsKill.Windows.Tests.csproj -c Release
      - name: Publish Windows x64 self-contained single-file EXE
        shell: pwsh
        run: |
          dotnet publish windows/AdsKill.Windows/AdsKill.Windows.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None -p:PublishTrimmed=false `
            --output dist
      - name: Package portable Windows beta and file checksum
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/AdsKill.Windows.exe'
          if (!(Test-Path $exe)) { throw "Missing AdsKill.Windows.exe" }
          $folder = Join-Path $env:GITHUB_WORKSPACE 'package'
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item $exe -Destination $folder
          Copy-Item windows/README.md -Destination (Join-Path $folder 'README.md')
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          "$hash  AdsKill.Windows.exe" | Set-Content (Join-Path $folder 'SHA256SUMS.txt') -Encoding utf8
          Compress-Archive -Path "$folder/*" -DestinationPath 'AdsKill-Windows-v0.2.0-beta1-win-x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ADS-Kill-Windows-0.2.0-beta1
          path: AdsKill-Windows-v0.2.0-beta1-win-x64.zip
          retention-days: 30
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/feature/windows-auto-updater-0.2.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'adskill-windows-v0.2.0-beta1'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag 'AdsKill-Windows-v0.2.0-beta1-win-x64.zip' `
              --target "$env:GITHUB_SHA" --prerelease `
              --title 'ADS Kill Windows 0.2 Beta 1 - automatic update checks' `
              --notes 'Standalone Windows 11 x64 HOSTS beta. Automatic GitHub beta check, explicit ZIP download with SHA-256 verification, manual installation of unsigned EXE. HOSTS safety/backups unchanged. No VPN or universal YouTube ad blocking.'
            if ($LASTEXITCODE -ne 0) { throw "Cannot publish beta" }
          } else {
            gh release upload $tag 'AdsKill-Windows-v0.2.0-beta1-win-x64.zip' --clobber
            if ($LASTEXITCODE -ne 0) { throw "Cannot update beta asset" }
            gh release edit $tag --target "$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Cannot update release target" }
          }
